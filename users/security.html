<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Security & Password - PortalStore</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <!-- Supabase CDN & Client Script -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../supabase.js"></script>
  <style>
    [x-cloak] { display: none !important; }
  </style>
</head>
<body class="bg-gray-50 text-gray-900 font-sans pb-20" 
      x-data="securityPageData()" 
      x-init="initSecurity()"
      x-cloak>

  <!-- HEADER -->
  <header class="bg-white border-b border-gray-100 sticky top-0 z-20">
    <div class="max-w-md mx-auto px-4 py-3 flex items-center justify-between">
      <a href="account.html" class="text-xs text-teal-600 font-semibold flex items-center gap-1 hover:underline">
        ← Back
      </a>
      <span class="font-bold text-gray-800 text-base">Security & Password</span>
      <div class="w-8"></div>
    </div>
  </header>

  <main class="max-w-md mx-auto p-4 space-y-4">

    <!-- FORM CARD -->
    <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 space-y-4">
      <div>
        <h3 class="font-bold text-gray-800 text-sm">Change Login Password</h3>
        <p class="text-xs text-gray-400 mt-0.5">Ensure your account uses a strong and unique password.</p>
      </div>

      <!-- ALERTS -->
      <div x-show="errorMessage" x-text="errorMessage" class="p-3 bg-red-50 text-red-600 text-xs rounded-xl text-center border border-red-100" x-cloak></div>
      <div x-show="successMessage" x-text="successMessage" class="p-3 bg-green-50 text-green-600 text-xs rounded-xl text-center border border-green-100" x-cloak></div>

      <form @submit.prevent="handleChangePassword()" class="space-y-3">
        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1">Current Password</label>
          <input type="password" x-model="form.currentPassword" required placeholder="••••••••"
                 class="w-full px-3.5 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-xs focus:bg-white focus:ring-2 focus:ring-teal-500 outline-none transition">
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1">New Password</label>
          <input type="password" x-model="form.newPassword" required placeholder="••••••••"
                 class="w-full px-3.5 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-xs focus:bg-white focus:ring-2 focus:ring-teal-500 outline-none transition">
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1">Confirm New Password</label>
          <input type="password" x-model="form.confirmPassword" required placeholder="••••••••"
                 class="w-full px-3.5 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-xs focus:bg-white focus:ring-2 focus:ring-teal-500 outline-none transition">
        </div>

        <button type="submit" :disabled="loading"
                class="w-full bg-teal-600 hover:bg-teal-700 text-white font-semibold py-3 rounded-xl text-xs shadow-sm transition mt-2 disabled:opacity-50">
          <span x-text="loading ? 'Updating...' : 'Update Password'"></span>
        </button>
      </form>
    </div>

  </main>

  <!-- BOTTOM NAVIGATION BAR -->
  <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-100 flex justify-around py-3 z-20 max-w-md mx-auto shadow-lg">
    <a href="dashboard.html" class="flex flex-col items-center text-xs font-medium text-gray-400 hover:text-teal-600 transition">
      <span class="text-base">🏠</span>
      <span class="mt-0.5">Home</span>
    </a>
    <a href="tasks.html" class="flex flex-col items-center text-xs font-medium text-gray-400 hover:text-teal-600 transition">
      <span class="text-base">💼</span>
      <span class="mt-0.5">Job</span>
    </a>
    <a href="records.html" class="flex flex-col items-center text-xs font-medium text-gray-400 hover:text-teal-600 transition">
      <span class="text-base">💳</span>
      <span class="mt-0.5">Records</span>
    </a>
    <a href="account.html" class="flex flex-col items-center text-xs font-bold text-teal-600 transition">
      <span class="text-base">👤</span>
      <span class="mt-0.5">Account</span>
    </a>
  </nav>

  <script>
    function securityPageData() {
      return {
        errorMessage: '',
        successMessage: '',
        loading: false,
        form: {
          currentPassword: '',
          newPassword: '',
          confirmPassword: ''
        },
        async initSecurity() {
          const user = await DB.getCurrentUser();
          if (!user) {
            window.location.href = '../login.html';
          }
        },
        async handleChangePassword() {
          this.errorMessage = '';
          this.successMessage = '';

          if (this.form.newPassword !== this.form.confirmPassword) {
            this.errorMessage = 'New passwords do not match.';
            return;
          }

          if (this.form.newPassword.length < 4) {
            this.errorMessage = 'New password must be at least 4 characters.';
            return;
          }

          this.loading = true;

          try {
            // 1. Verify current password by attempting a sign-in or validation
            const currentUser = await DB.getCurrentUser();
            if (!currentUser || !currentUser.phone) {
              throw new Error("Session expired. Please log in again.");
            }

            // Optional check against your custom users table password column if used directly
            if (currentUser.password && currentUser.password !== this.form.currentPassword) {
              this.errorMessage = 'Incorrect current password.';
              this.loading = false;
              return;
            }

            // 2. Update password in the custom users table
            const { error: dbError } = await supabaseClient
              .from('users')
              .update({ password: this.form.newPassword })
              .eq('id', currentUser.id);

            if (dbError) throw dbError;

            // 3. Update password via Supabase Auth if applicable
            const { error: authError } = await supabaseClient.auth.updateUser({
              password: this.form.newPassword
            });

            if (authError) {
              console.warn("Supabase auth password update warning:", authError.message);
            }

            this.successMessage = 'Password updated successfully!';
            this.form.currentPassword = '';
            this.form.newPassword = '';
            this.form.confirmPassword = '';

          } catch (err) {
            console.error("Password update error:", err);
            this.errorMessage = err.message || 'Failed to update password. Please try again.';
          } finally {
            this.loading = false;
          }
        }
      }
    }
  </script>
</body>
</html>
