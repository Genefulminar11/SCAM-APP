<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bank & E-Wallet Details - PortalStore</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../supabase.js"></script>
  <style>
    [x-cloak] { display: none !important; }
  </style>
</head>
<body class="bg-gray-50 text-gray-900 font-sans pb-20" 
      x-data="bankPageData()" 
      x-init="initBank()"
      x-cloak>

  <!-- HEADER -->
  <header class="bg-white border-b border-gray-100 sticky top-0 z-20">
    <div class="max-w-md mx-auto px-4 py-3 flex items-center justify-between">
      <a href="account.html" class="text-xs text-teal-600 font-semibold flex items-center gap-1 hover:underline">
        ← Back
      </a>
      <span class="font-bold text-gray-800 text-base">Bank / E-Wallet</span>
      <div class="w-8"></div>
    </div>
  </header>

  <main class="max-w-md mx-auto p-4 space-y-4">

    <!-- SAVED ACCOUNTS LIST -->
    <template x-if="savedBanks.length > 0">
      <div class="space-y-3">
        <h4 class="text-xs font-bold text-gray-500 uppercase tracking-wider px-1">Saved Accounts</h4>
        <template x-for="(acc, index) in savedBanks" :key="acc.id || index">
          <div class="bg-gradient-to-tr from-teal-700 to-teal-500 text-white p-4 rounded-2xl shadow-sm space-y-2">
            <div class="flex justify-between items-center">
              <span class="text-xs font-semibold uppercase tracking-wider text-teal-100" x-text="acc.account_type || acc.accountType"></span>
              <div class="flex items-center gap-2">
                <button @click="openEditModal(acc)" class="text-[10px] bg-white/20 hover:bg-white/30 px-2 py-0.5 rounded-full border border-white/30 transition">Edit</button>
                <button @click="deleteAccount(acc)" class="text-[10px] bg-rose-600/60 hover:bg-rose-600 px-2 py-0.5 rounded-full border border-rose-400/30 transition">Delete</button>
              </div>
            </div>
            <div>
              <p class="text-[11px] text-teal-100">Account Holder</p>
              <p class="text-sm font-bold tracking-wide" x-text="acc.account_name || acc.accountName"></p>
            </div>
            <div>
              <p class="text-[11px] text-teal-100">Account / Mobile Number</p>
              <p class="text-base font-mono font-bold tracking-wider" x-text="acc.account_number || acc.accountNumber"></p>
            </div>
          </div>
        </template>
      </div>
    </template>

    <!-- FORM CARD -->
    <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 space-y-4">
      <div>
        <h3 class="font-bold text-gray-800 text-sm">Add Payment Account</h3>
        <p class="text-xs text-gray-400 mt-0.5">Enter a new e-wallet or bank account for withdrawals.</p>
      </div>

      <!-- ALERTS -->
      <div x-show="errorMessage" x-text="errorMessage" class="p-3 bg-red-50 text-red-600 text-xs rounded-xl text-center border border-red-100" x-cloak></div>
      <div x-show="successMessage" x-text="successMessage" class="p-3 bg-green-50 text-green-600 text-xs rounded-xl text-center border border-green-100" x-cloak></div>

      <form @submit.prevent="handleSaveBank()" class="space-y-3">
        
        <!-- 1. Account Category Selector -->
        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1">Account Category</label>
          <select x-model="formCategory" @change="updateProviderList()"
                  class="w-full px-3.5 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-xs focus:bg-white focus:ring-2 focus:ring-teal-500 outline-none transition font-semibold">
            <option value="ewallet">E-Wallet</option>
            <option value="bank">Bank Account</option>
          </select>
        </div>

        <!-- 2. Dynamic Provider Selector -->
        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1" x-text="formCategory === 'ewallet' ? 'Select E-Wallet Type' : 'Select Bank Name'"></label>
          <select x-model="form.accountType" required
                  class="w-full px-3.5 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-xs focus:bg-white focus:ring-2 focus:ring-teal-500 outline-none transition font-semibold">
            <option value="" disabled>Select Provider</option>
            <template x-for="provider in currentProviders" :key="provider.name">
              <option :value="provider.name" x-text="provider.name"></option>
            </template>
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1">Account Holder Name</label>
          <input type="text" x-model="form.accountName" required placeholder="Juan Dela Cruz"
                 class="w-full px-3.5 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-xs focus:bg-white focus:ring-2 focus:ring-teal-500 outline-none transition">
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1">Account Number / Mobile Number</label>
          <input type="text" x-model="form.accountNumber" required placeholder="09123456789 or Account No."
                 class="w-full px-3.5 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-xs focus:bg-white focus:ring-2 focus:ring-teal-500 outline-none transition font-mono">
        </div>

        <button type="submit" 
                class="w-full bg-teal-600 hover:bg-teal-700 text-white font-semibold py-3 rounded-xl text-xs shadow-sm transition mt-2">
          + Add Account
        </button>
      </form>
    </div>

  </main>

  <!-- EDIT MODAL -->
  <div x-show="showModal" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4" x-cloak>
    <div class="bg-white rounded-2xl w-full max-w-sm p-5 space-y-4 shadow-xl" @click.away="showModal = false">
      <div class="flex justify-between items-center">
        <h3 class="font-bold text-gray-800 text-sm uppercase">Edit Account Details</h3>
        <button @click="showModal = false" class="text-gray-400 hover:text-gray-600 font-bold">✕</button>
      </div>

      <form @submit.prevent="saveModalSettings()" class="space-y-3 text-xs">
        <div>
          <label class="block font-semibold text-gray-700 mb-1">Provider</label>
          <input type="text" x-model="modalForm.accountType" disabled
                 class="w-full px-3.5 py-2.5 bg-gray-100 border border-gray-200 rounded-xl text-gray-500 outline-none font-semibold">
        </div>

        <div>
          <label class="block font-semibold text-gray-700 mb-1">Account Holder Name</label>
          <input type="text" x-model="modalForm.accountName" required
                 class="w-full px-3.5 py-2.5 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-teal-500 outline-none transition">
        </div>

        <div>
          <label class="block font-semibold text-gray-700 mb-1">Account / Mobile Number</label>
          <input type="text" x-model="modalForm.accountNumber" required
                 class="w-full px-3.5 py-2.5 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-teal-500 outline-none transition font-mono">
        </div>

        <div class="flex gap-2 pt-2">
          <button type="button" @click="showModal = false" class="w-1/2 bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold py-2.5 rounded-xl transition">Cancel</button>
          <button type="submit" class="w-1/2 bg-teal-600 hover:bg-teal-700 text-white font-bold py-2.5 rounded-xl transition">Save</button>
        </div>
      </form>
    </div>
  </div>

  <!-- BOTTOM NAVIGATION BAR -->
  <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-100 flex justify-around py-3 z-20 max-w-md mx-auto shadow-lg">
    <a href="dashboard.html" class="flex flex-col items-center text-xs font-medium text-gray-400 hover:text-teal-600 transition">
      <span class="text-base">🏠</span>
      <span class="mt-0.5">Home</span>
    </a>
    <a href="tasks.html" class="flex flex-col items-center text-xs font-medium text-gray-400 hover:text-teal-600 transition">
      <span class="text-base">💼</span>
      <span class="mt-0.5">Job</span>
    </a>
    <a href="records.html" class="flex flex-col items-center text-xs font-medium text-gray-400 hover:text-teal-600 transition">
      <span class="text-base">💳</span>
      <span class="mt-0.5">Records</span>
    </a>
    <a href="account.html" class="flex flex-col items-center text-xs font-bold text-teal-600 transition">
      <span class="text-base">👤</span>
      <span class="mt-0.5">Account</span>
    </a>
  </nav>

  <script>
    function bankPageData() {
      return {
        savedBanks: [],
        errorMessage: '',
        successMessage: '',
        formCategory: 'ewallet',
        currentProviders: [],
        showModal: false,
        ewallets: [
          { name: 'Maya' }, { name: 'GCash' }, { name: 'Coins PH' }, { name: 'GrabPay' }, 
          { name: 'PayPal' }, { name: 'BPI Direct BanKo' }, { name: 'Tala Wallet' }, 
          { name: 'DragonPay Credits' }, { name: 'Lazada Wallet' }, { name: '7-11 CLIQQ Pay' }, 
          { name: 'ML Wallet' }, { name: 'Trust Wallet' }
        ],
        banks: [
          { name: 'BDO Unibank, Inc.' }, { name: 'Land Bank of the Philippines (LandBank)' }, 
          { name: 'Bank of the Philippine Islands (BPI)' }, { name: 'Metropolitan Bank & Trust Company (Metrobank)' }, 
          { name: 'China Banking Corporation (Chinabank)' }, { name: 'Rizal Commercial Banking Corporation (RCBC)' }, 
          { name: 'Security Bank Corporation' }, { name: 'Philippine National Bank (PNB)' }, 
          { name: 'Development Bank of the Philippines (DBP)' }, { name: 'Union Bank of the Philippines (UnionBank)' }, 
          { name: 'HSBC' }, { name: 'Bank of America' }, { name: 'CitiBank' }, { name: 'MUFG Bank' }, 
          { name: 'Standard Chartered Philippines' }, { name: 'Philippine Savings Bank (PSBank)' }, 
          { name: 'China Bank Savings (CBS)' }, { name: 'City Savings Bank (CSB)' }, { name: 'Bank of Makati' }, 
          { name: 'AllBank, Inc.' }, { name: 'Bangko Kabayan, Inc.' }, { name: 'BDO Network Bank, Inc.' }, 
          { name: 'EastWest Rural Bank, Inc. (EWRB)' }, { name: 'CARD Bank, Inc.' }, { name: 'Cebuana Lhuillier Rural Bank' }, 
          { name: 'Maya Bank, Inc.' }, { name: 'GoTyme Bank' }, { name: 'UnionDigital Bank' }, { name: 'Unobank, Inc.' }, 
          { name: 'Tonik Digital Bank, Inc.' }, { name: 'Overseas Filipino Bank (OFBank)' }
        ],
        form: {
          accountType: '',
          accountName: '',
          accountNumber: ''
        },
        modalForm: {
          id: null,
          accountType: '',
          accountName: '',
          accountNumber: ''
        },
        currentUserObj: null,

        async initBank() {
          const currentUser = await DB.getCurrentUser();
          if (!currentUser) {
            window.location.href = '../login.html';
            return;
          }
          this.currentUserObj = currentUser;
          await this.loadBanks();
          this.updateProviderList();
        },
        async loadBanks() {
          const data = await DB.getBankDetails();
          this.savedBanks = (data || []).filter(acc => (acc.account_name || acc.accountName));
        },
        updateProviderList() {
          if (this.formCategory === 'ewallet') {
            this.currentProviders = this.ewallets;
          } else {
            this.currentProviders = this.banks;
          }
          this.form.accountType = '';
        },
        async handleSaveBank() {
          this.errorMessage = '';
          this.successMessage = '';

          if (!this.currentUserObj) {
            this.errorMessage = 'User session not found. Please log in again.';
            return;
          }

          const { error } = await supabaseClient
            .from('user_banks')
            .insert([
              {
                user_id: this.currentUserObj.id,
                account_type: this.form.accountType,
                account_name: this.form.accountName,
                account_number: this.form.accountNumber
              }
            ]);

          if (error) {
            this.errorMessage = error.message;
            return;
          }

          this.successMessage = 'Payment account added successfully!';
          await this.loadBanks();

          this.form.accountType = '';
          this.form.accountName = '';
          this.form.accountNumber = '';
        },
        openEditModal(acc) {
          this.modalForm = {
            id: acc.id,
            accountType: acc.account_type || acc.accountType,
            accountName: acc.account_name || acc.accountName,
            accountNumber: acc.account_number || acc.accountNumber
          };
          this.showModal = true;
        },
        async saveModalSettings() {
          this.errorMessage = '';
          this.successMessage = '';

          if (!this.modalForm.id) {
            this.errorMessage = 'Missing account ID for updating.';
            return;
          }

          const { error } = await supabaseClient
            .from('user_banks')
            .update({
              account_name: this.modalForm.accountName,
              account_number: this.modalForm.accountNumber
            })
            .eq('id', this.modalForm.id);

          if (error) {
            this.errorMessage = error.message;
            return;
          }

          this.successMessage = 'Account details updated successfully!';
          await this.loadBanks();
          this.showModal = false;
        },
        async deleteAccount(acc) {
          if (!confirm(`Are you sure you want to delete this payment account?`)) return;

          const targetId = acc.id;
          if (!targetId) {
            this.errorMessage = 'Invalid account ID';
            return;
          }

          const { error } = await supabaseClient
            .from('user_banks')
            .delete()
            .eq('id', targetId);

          if (error) {
            this.errorMessage = error.message;
            return;
          }

          this.successMessage = 'Account deleted successfully!';
          await this.loadBanks();
        }
      }
    }
  </script>
</body>
</html>
