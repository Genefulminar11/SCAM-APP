<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team Tree & Members - PortalStore</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Alpine JS Core -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <!-- Supabase CDN & Client Script -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../supabase.js"></script>
  <style>
    [x-cloak] { display: none !important; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans pb-24" 
      x-data="teamPage()" 
      x-init="initTeam()"
      x-cloak>

  <!-- HEADER -->
  <header class="bg-white/90 backdrop-blur-md border-b border-slate-100 sticky top-0 z-20">
    <div class="max-w-md mx-auto px-4 py-3.5 flex items-center justify-between">
      <a href="account.html" class="text-xs font-semibold text-emerald-600 flex items-center gap-1 hover:underline">
        ← Back
      </a>
      <h1 class="font-bold text-slate-800 text-sm">Team Genealogy Tree</h1>
      <div class="w-8"></div>
    </div>
  </header>

  <main class="max-w-md mx-auto p-4 space-y-4">

    <!-- TEAM SUMMARY CARDS -->
    <div class="grid grid-cols-2 gap-3">
      <div class="bg-white p-4 rounded-3xl border border-slate-100 shadow-sm">
        <p class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Total Branch Members</p>
        <p class="text-xl font-black text-slate-800 mt-1" x-text="stats.totalMembers"></p>
      </div>
      <div class="bg-white p-4 rounded-3xl border border-slate-100 shadow-sm">
        <p class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Team Commission</p>
        <p class="text-xl font-black text-emerald-600 mt-1" x-text="stats.totalCommissions"></p>
      </div>
    </div>

    <!-- INVITATION CODE BANNER -->
    <div class="bg-gradient-to-br from-slate-900 via-emerald-950 to-slate-900 text-white p-5 rounded-3xl shadow-xl space-y-3 border border-slate-800 relative overflow-hidden">
      <div class="flex items-center justify-between relative z-10">
        <div class="space-y-1">
          <p class="text-[10px] text-emerald-400 font-bold uppercase tracking-wider">Your Invitation Code</p>
          <p class="text-xl font-mono font-black tracking-widest text-white" x-text="user ? (user.ref_code || '') : ''"></p>
        </div>
        <button @click="copyCode()" class="text-xs bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2.5 rounded-2xl font-bold shadow-md shadow-emerald-600/20 transition">
          <span x-text="copied ? 'Copied!' : 'Copy Code'"></span>
        </button>
      </div>
      <p class="text-[10px] text-slate-400 relative z-10">Share this code with friends so they automatically sprout on your family tree branch.</p>
      <div class="absolute -bottom-10 -right-10 w-32 h-32 bg-emerald-500/10 rounded-full blur-2xl pointer-events-none"></div>
    </div>

    <!-- FAMILY TREE VIEW SECTION -->
    <div class="space-y-3">
      <div class="flex items-center justify-between px-1">
        <h4 class="text-xs font-bold text-slate-600 uppercase tracking-wider">Downline Branch Structure</h4>
        <span class="text-[10px] font-bold text-emerald-600 bg-emerald-50 px-2.5 py-0.5 rounded-full" x-text="`${stats.totalMembers} Nodes`"></span>
      </div>

      <!-- TREE CONTAINER -->
      <div class="bg-white rounded-3xl border border-slate-100 shadow-sm p-4 space-y-4">
        
        <!-- ROOT NODE (YOU) -->
        <div class="flex items-center gap-3 p-3 bg-emerald-50/60 border border-emerald-100 rounded-2xl">
          <div class="w-10 h-10 bg-emerald-600 text-white rounded-xl flex items-center justify-center font-black text-xs shadow-sm">
            ROOT
          </div>
          <div class="flex-1">
            <p class="text-xs font-black text-slate-800">You (Main Tree Head)</p>
            <p class="text-[10px] text-emerald-700 font-medium">Invitation Code: <span class="font-mono font-bold" x-text="user ? user.ref_code : ''"></span></p>
          </div>
          <span class="text-[10px] font-bold bg-emerald-600 text-white px-2 py-0.5 rounded-full">Active</span>
        </div>

        <!-- EMPTY STATE -->
        <template x-if="stats.members.length === 0">
          <div class="py-8 text-center space-y-2 border-t border-dashed border-slate-100 mt-2">
            <div class="w-12 h-12 bg-slate-50 text-slate-400 rounded-2xl flex items-center justify-center mx-auto text-lg border border-slate-100">
              🌱
            </div>
            <p class="text-xs font-bold text-slate-700">No branches on your tree yet</p>
            <p class="text-[11px] text-slate-400">Invite users to watch your team grow branches downwards.</p>
          </div>
        </template>

        <!-- RECURSIVE TEMPLATE FOR BRANCH NODES -->
        <template x-for="member in stats.members" :key="member.id">
          <div>
            <!-- Node Card -->
            <div class="relative pl-6 pt-2">
              <div class="absolute left-2.5 top-0 bottom-4 w-0.5 bg-emerald-200"></div>
              <div class="absolute left-2.5 top-6 w-3 h-0.5 bg-emerald-200"></div>

              <div @click="member.open = !member.open" 
                   class="bg-slate-50 border border-slate-100 p-3.5 rounded-2xl flex items-center justify-between shadow-sm hover:border-emerald-200 cursor-pointer transition">
                <div class="flex items-center gap-3">
                  <div class="w-9 h-9 bg-white border border-emerald-100 text-emerald-600 rounded-xl flex items-center justify-center font-bold text-xs shadow-sm">
                    <span x-text="member.phone ? member.phone.slice(-2) : 'TR'"></span>
                  </div>
                  <div>
                    <div class="flex items-center gap-2">
                      <p class="text-xs font-bold text-slate-800" x-text="member.phone"></p>
                      <span class="text-[9px] font-bold bg-emerald-100 text-emerald-800 px-1.5 py-0.5 rounded" x-text="`Tier ${member.tier || 1}`"></span>
                      <span class="text-[9px] font-mono text-slate-400" x-text="`(${member.ref_code})`"></span>
                    </div>
                    <p class="text-[10px] text-slate-400 mt-0.5">Joined: <span x-text="formatDate(member.updated_at)"></span></p>
                  </div>
                </div>

                <div class="flex items-center gap-2">
                  <template x-if="member.children && member.children.length > 0">
                    <span class="text-[10px] font-bold text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded-md border border-emerald-100" 
                          x-text="member.open ? '▲ Hide Sub-nodes' : `▼ View Downlines (${member.children.length})`"></span>
                  </template>
                  <span class="text-[10px] font-bold bg-emerald-50 text-emerald-600 border border-emerald-100 px-2.5 py-1 rounded-full">
                    Active
                  </span>
                </div>
              </div>
            </div>

            <!-- COLLAPSIBLE DROPDOWN CHILDREN NODES -->
            <template x-if="member.children && member.children.length > 0">
              <div x-show="member.open" x-transition class="pl-8 space-y-2 mt-2 border-l-2 border-emerald-100 ml-4">
                <template x-for="child in member.children" :key="child.id">
                  <div class="bg-emerald-50/40 border border-emerald-100 p-3 rounded-xl flex items-center justify-between shadow-xs">
                    <div class="flex items-center gap-2">
                      <div class="w-7 h-7 bg-white border border-emerald-200 text-emerald-700 rounded-lg flex items-center justify-center font-bold text-[10px]">
                        <span x-text="child.phone ? child.phone.slice(-2) : 'CH'"></span>
                      </div>
                      <div>
                        <div class="flex items-center gap-1.5">
                          <p class="text-xs font-bold text-slate-800" x-text="child.phone"></p>
                          <span class="text-[9px] font-bold bg-emerald-200 text-emerald-900 px-1 py-0.5 rounded" x-text="`Tier ${child.tier}`"></span>
                        </div>
                        <p class="text-[9px] text-slate-400">Ref: <span class="font-mono" x-text="child.ref_code"></span></p>
                      </div>
                    </div>
                    <span class="text-[9px] font-bold bg-emerald-600 text-white px-2 py-0.5 rounded-full">Sub-branch</span>
                  </div>
                </template>
              </div>
            </template>
          </div>
        </template>

      </div>
    </div>

  </main>

  <!-- BOTTOM NAVIGATION BAR -->
  <nav class="fixed bottom-0 left-0 right-0 bg-white/90 backdrop-blur-md border-t border-slate-100 flex justify-around py-3 z-20 max-w-md mx-auto shadow-lg">
    <a href="dashboard.html" class="flex flex-col items-center text-xs font-medium text-slate-400 hover:text-emerald-600 transition">
      <span class="text-base">🏠</span>
      <span class="mt-0.5">Home</span>
    </a>
    <a href="tasks.html" class="flex flex-col items-center text-xs font-medium text-slate-400 hover:text-emerald-600 transition">
      <span class="text-base">💼</span>
      <span class="mt-0.5">Job</span>
    </a>
    <a href="records.html" class="flex flex-col items-center text-xs font-medium text-slate-400 hover:text-emerald-600 transition">
      <span class="text-base">💳</span>
      <span class="mt-0.5">Records</span>
    </a>
    <a href="account.html" class="flex flex-col items-center text-xs font-bold text-emerald-600 transition">
      <span class="text-base">👤</span>
      <span class="mt-0.5">Account</span>
    </a>
  </nav>

  <script>
    function teamPage() {
      return {
        user: null,
        stats: {
          totalMembers: 0,
          totalCommissions: '₱0.00',
          members: []
        },
        copied: false,
        
        async initTeam() {
          try {
            const currentUser = await DB.getCurrentUser();
            if (!currentUser) {
              window.location.href = '../login.html';
              return;
            }
            this.user = currentUser;
            const teamData = await DB.getTeamStats();
            if (teamData) {
              this.stats = teamData;
            }
          } catch (e) {
            console.error("Error loading team page data:", e);
          }
        },
        
        copyCode() {
          const codeToCopy = this.user ? (this.user.ref_code || '') : '';
          if (codeToCopy) {
            navigator.clipboard.writeText(codeToCopy);
            this.copied = true;
            setTimeout(() => this.copied = false, 2000);
          }
        },
        
        formatDate(isoString) {
          if (!isoString) return 'Recently';
          const date = new Date(isoString);
          return date.toLocaleDateString('en-US', { 
            month: 'short', 
            day: 'numeric', 
            year: 'numeric' 
          });
        }
      }
    }
  </script>
</body>
</html>
