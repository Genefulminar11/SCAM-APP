<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order History - PortalStore</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../supabase.js"></script>
  <style>
    [x-cloak] { display: none !important; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans pb-24" x-data="orderHistoryData()" x-init="init()" x-cloak>

  <!-- HEADER -->
  <header class="bg-white border-b border-slate-100 sticky top-0 z-20">
    <div class="max-w-md mx-auto px-4 py-3.5 flex items-center justify-between">
      <a href="account.html" class="text-xs font-semibold text-emerald-600 flex items-center gap-1 hover:underline">
        ← Back
      </a>
      <h1 class="font-bold text-slate-800 text-sm">Order History</h1>
      <div class="w-8"></div>
    </div>
  </header>

  <main class="max-w-md mx-auto p-4 space-y-4">

    <!-- SUMMARY HEADER CARD -->
    <div class="bg-gradient-to-br from-slate-900 via-emerald-950 to-slate-900 text-white p-5 rounded-3xl shadow-xl flex justify-between items-center border border-slate-800">
      <div>
        <p class="text-[10px] text-slate-300 font-bold uppercase tracking-wider">Total Completed Orders</p>
        <p class="text-2xl font-black text-emerald-400 mt-0.5"><span x-text="orders.length"></span> Tasks</p>
      </div>
      <div class="w-11 h-11 bg-emerald-500/10 rounded-2xl border border-emerald-500/20 flex items-center justify-center text-xl shadow-inner">
        📦
      </div>
    </div>

    <!-- ERROR NOTIFICATION -->
    <div x-show="errorMessage" x-text="errorMessage" class="p-3 bg-rose-50 text-rose-600 text-xs rounded-2xl text-center border border-rose-100 font-medium" x-cloak></div>

    <!-- ORDERS LIST -->
    <div class="space-y-3">
      <h4 class="text-xs font-bold text-slate-400 uppercase tracking-wider px-1">Completed Order Records</h4>

      <template x-if="loading">
        <div class="bg-white p-8 rounded-3xl border border-slate-100 text-center space-y-2">
          <p class="text-xs text-slate-400 font-medium">Loading history...</p>
        </div>
      </template>

      <template x-if="!loading && orders.length === 0">
        <div class="bg-white p-8 rounded-3xl border border-slate-100 shadow-sm text-center space-y-2">
          <div class="w-12 h-12 bg-slate-50 text-slate-400 rounded-2xl flex items-center justify-center mx-auto text-xl border border-slate-100">
            🛒
          </div>
          <p class="text-xs font-bold text-slate-700">No Orders Completed Yet</p>
          <p class="text-[11px] text-slate-400">Head to the Job page to complete your tasks.</p>
        </div>
      </template>

      <template x-for="order in orders" :key="order.id">
        <div class="bg-white p-4 rounded-3xl border border-slate-100 shadow-sm space-y-3">
          
          <div class="flex items-center justify-between border-b border-slate-100 pb-2.5">
            <span class="text-[10px] font-mono text-slate-400 truncate max-w-[200px]" x-text="`ID: ${order.id}`"></span>
            <span class="text-[9px] font-extrabold bg-emerald-50 text-emerald-600 px-2.5 py-1 rounded-full border border-emerald-100">
              Completed
            </span>
          </div>

          <div class="flex items-center gap-3">
            <div class="w-12 h-12 bg-slate-50 rounded-2xl border border-slate-100 flex items-center justify-center text-xl shrink-0">
              📦
            </div>

            <div class="flex-1 min-w-0">
              <h5 class="text-xs font-bold text-slate-800 truncate" x-text="order.description || order.task_name || 'Order Task'"></h5>
              <p class="text-[10px] text-slate-400 mt-0.5" x-text="formatDate(order.created_at)"></p>
            </div>

            <div class="text-right shrink-0">
              <p class="text-[10px] text-slate-400 font-medium">Commission</p>
              <p class="text-xs font-black text-emerald-600" x-text="`+₱${parseFloat(order.amount || order.commission || 0).toFixed(2)}`"></p>
            </div>
          </div>

        </div>
      </template>
    </div>

  </main>

  <!-- BOTTOM NAVIGATION BAR -->
  <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-100 flex justify-around py-3 z-20 max-w-md mx-auto shadow-lg">
    <a href="dashboard.html" class="flex flex-col items-center text-xs font-medium text-slate-400 hover:text-emerald-600 transition">
      <span class="text-base">🏠</span>
      <span class="mt-0.5">Home</span>
    </a>
    <a href="tasks.html" class="flex flex-col items-center text-xs font-medium text-slate-400 hover:text-emerald-600 transition">
      <span class="text-base">💼</span>
      <span class="mt-0.5">Job</span>
    </a>
    <a href="records.html" class="flex flex-col items-center text-xs font-medium text-slate-400 hover:text-emerald-600 transition">
      <span class="text-base">💳</span>
      <span class="mt-0.5">Records</span>
    </a>
    <a href="account.html" class="flex flex-col items-center text-xs font-bold text-emerald-600 transition">
      <span class="text-base">👤</span>
      <span class="mt-0.5">Account</span>
    </a>
  </nav>

  <script>
    function orderHistoryData() {
      return {
        orders: [],
        loading: true,
        errorMessage: '',

        async init() {
          try {
            const currentUser = await DB.getCurrentUser();
            if (!currentUser) {
              window.location.href = '../login.html';
              return;
            }

            const { data, error } = await supabaseClient
              .from('orders')
              .select('*')
              .eq('user_id', currentUser.id)
              .order('created_at', { ascending: false });

            if (error) throw error;
            this.orders = data || [];
          } catch (err) {
            console.error('Error fetching order history:', err);
            this.errorMessage = 'Failed to load order history.';
          } finally {
            this.loading = false;
          }
        },

        formatDate(isoString) {
          if (!isoString) return 'Just now';
          const d = new Date(isoString);
          return d.toLocaleString('en-US', {
            month: 'short', 
            day: 'numeric', 
            year: 'numeric', 
            hour: '2-digit', 
            minute: '2-digit'
          });
        }
      }
    }
  </script>
</body>
</html>
