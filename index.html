<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PortalStore - Home</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-50 text-slate-900 font-sans min-h-screen flex flex-col justify-between selection:bg-teal-500 selection:text-white">

  <!-- UNIVERSAL HEADER -->
  <header class="bg-white/85 backdrop-blur-md border-b border-slate-200/60 sticky top-0 z-20">
    <div class="max-w-md mx-auto px-5 py-3.5 flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <div class="w-9 h-9 bg-gradient-to-tr from-teal-600 to-teal-500 rounded-xl flex items-center justify-center text-white font-black text-lg shadow-md shadow-teal-500/20">
          P
        </div>
        <span class="font-bold text-slate-800 text-base tracking-tight">PortalStore</span>
      </div>
      <a href="signup.html" class="bg-teal-600 hover:bg-teal-700 active:scale-[0.98] text-white text-xs font-bold px-4 py-2 rounded-xl shadow-sm shadow-teal-600/20 transition duration-150">
        Get Started
      </a>
    </div>
  </header>

  <!-- MAIN HERO CONTAINER -->
  <main class="max-w-md w-full mx-auto p-5 my-auto text-center space-y-6">
    
    <!-- BADGE & HERO HEADLINE -->
    <div>
      <span class="inline-flex items-center gap-1.5 bg-teal-50 text-teal-700 text-[11px] font-bold px-3 py-1 rounded-full mb-4 border border-teal-100 shadow-sm">
        <span class="w-1.5 h-1.5 rounded-full bg-teal-500 animate-pulse"></span>
        Verified E-Commerce Hub
      </span>
      
      <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900 tracking-tight leading-snug">
        Streamline Your Orders & Grow Your Team
      </h1>
      
      <p class="text-slate-500 text-xs sm:text-sm mt-3 leading-relaxed max-w-sm mx-auto">
        Manage store transactions seamlessly while building an affiliate team ecosystem.
      </p>
    </div>

    <!-- ACTION CARD -->
    <div class="bg-white p-6 rounded-3xl shadow-xl shadow-slate-200/50 border border-slate-100 flex flex-col gap-3">
      <a href="signup.html" class="w-full bg-teal-600 hover:bg-teal-700 active:scale-[0.98] text-white font-bold py-3.5 rounded-2xl text-xs shadow-md shadow-teal-600/20 transition duration-150">
        Create an Account
      </a>
      <a href="login.html" class="w-full bg-slate-50 hover:bg-slate-100 active:scale-[0.98] text-slate-700 font-bold py-3.5 rounded-2xl text-xs border border-slate-200/80 transition duration-150">
        Sign In to Dashboard
      </a>
    </div>

  </main>

  <!-- UNIVERSAL FOOTER -->
  <footer class="max-w-md mx-auto p-5 text-center text-[11px] text-slate-400">
    <p>&copy; 2026 PortalStore. All rights reserved.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
