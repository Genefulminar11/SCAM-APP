<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Bank & QR Code - Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../supabase.js"></script>
  <style>[x-cloak] { display: none !important; }</style>
</head>
<body class="bg-gray-50 text-gray-900 font-sans pb-24" 
      x-data="adminBankData()" 
      x-init="initBank()"
      x-cloak>

  <!-- HEADER -->
  <header class="bg-white border-b border-gray-100 sticky top-0 z-20">
    <div class="max-w-md mx-auto px-4 py-3 flex items-center justify-between">
      <a href="dashboard.html" class="text-xs text-emerald-600 font-semibold flex items-center gap-1 hover:underline">
        ← Dashboard
      </a>
      <span class="font-bold text-gray-800 text-base">Payment Channels</span>
      <div class="w-8"></div>
    </div>
  </header>

  <main class="max-w-md mx-auto p-4 space-y-4">

    <!-- SUCCESS/ERROR MESSAGES -->
    <div x-show="errorMessage" x-text="errorMessage" class="p-3 bg-red-50 text-red-600 text-xs rounded-xl text-center border border-red-100 font-medium" x-cloak></div>
    <div x-show="successMessage" x-text="successMessage" class="p-3 bg-emerald-50 text-emerald-600 text-xs rounded-xl text-center border border-emerald-100 font-medium" x-cloak></div>

    <!-- ACTIVE DEPOSIT ACCOUNTS CARDS -->
    <div class="space-y-3">
      <h4 class="text-xs font-bold text-gray-400 uppercase tracking-wider px-1">Active Deposit Accounts</h4>
      
      <template x-for="(val, key) in settings" :key="key">
        <template x-if="key.endsWith('_name') && val">
          <div class="bg-gradient-to-br from-emerald-800 via-emerald-700 to-teal-800 text-white p-4 rounded-2xl shadow-sm space-y-3">
            <div class="flex justify-between items-center">
              <span class="text-xs font-semibold uppercase tracking-wider text-emerald-100" x-text="key.replace('_name', '').replace(/_/g, ' ')"></span>
              <div class="flex items-center gap-2">
                <button @click="openEditModal(key.replace('_name', ''))" class="text-[10px] bg-white/25 hover:bg-white/35 px-2.5 py-1 rounded-full font-bold transition">Edit</button>
                <button @click="deleteAccount(key.replace('_name', ''))" class="text-[10px] bg-red-600/70 hover:bg-red-600 px-2.5 py-1 rounded-full font-bold transition">Delete</button>
              </div>
            </div>
            <div class="flex items-center justify-between">
              <div class="space-y-2">
                <div>
                  <p class="text-[10px] text-emerald-200 font-bold uppercase tracking-wider">Account Name</p>
                  <p class="text-sm font-bold tracking-wide" x-text="val"></p>
                </div>
                <div>
                  <p class="text-[10px] text-emerald-200 font-bold uppercase tracking-wider">Account / Mobile Number</p>
                  <p class="text-base font-mono font-bold tracking-wider" x-text="settings[key.replace('_name', '_number')]"></p>
                </div>
              </div>
              <template x-if="settings[key.replace('_name', '_qr')]">
                <div class="bg-white p-1 rounded-xl shadow-sm">
                  <img :src="settings[key.replace('_name', '_qr')]" class="w-16 h-16 object-contain rounded-lg">
                </div>
              </template>
            </div>
          </div>
        </template>
      </template>

      <template x-if="Object.keys(settings).filter(k => k.endsWith('_name') && settings[k]).length === 0">
        <div class="bg-white p-6 rounded-2xl border border-gray-100 text-center text-xs text-gray-400 shadow-sm">
          No active payment channels configured yet.
        </div>
      </template>
    </div>

    <!-- ADD / CONFIGURE FORM CARD -->
    <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 space-y-4">
      <div>
        <h3 class="font-bold text-gray-800 text-sm">Manage Channel Details</h3>
        <p class="text-xs text-gray-400 mt-0.5">Modify information and upload QR codes for user top-ups.</p>
      </div>

      <form @submit.prevent="saveSettings()" class="space-y-4 text-xs">
        
        <!-- 1. Category Selector -->
        <div>
          <label class="block font-bold text-gray-700 mb-1">Account Category</label>
          <select x-model="formCategory" @change="updateProviderList()"
                  class="w-full px-3.5 py-2.5 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-emerald-500 outline-none transition font-semibold">
            <option value="ewallet">E-Wallet</option>
            <option value="bank">Bank Account</option>
          </select>
        </div>

        <!-- 2. Dynamic Type Selector -->
        <div>
          <label class="block font-bold text-gray-700 mb-1" x-text="formCategory === 'ewallet' ? 'Select E-Wallet Type' : 'Select Bank Name'"></label>
          <select x-model="activeTab" 
                  class="w-full px-3.5 py-2.5 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-emerald-500 outline-none transition font-semibold">
            <template x-for="provider in currentProviders" :key="provider.id">
              <option :value="provider.id" x-text="provider.name"></option>
            </template>
          </select>
        </div>

        <!-- FORM INPUT FIELDS -->
        <div class="space-y-3 pt-1">
          <div>
            <label class="block font-bold text-gray-700 mb-1">Account Holder Name</label>
            <input type="text" x-model="form.name" required placeholder="Enter account name"
                   class="w-full px-3.5 py-2.5 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-emerald-500 outline-none transition">
          </div>

          <div>
            <label class="block font-bold text-gray-700 mb-1">Account / Mobile Number</label>
            <input type="text" x-model="form.number" required placeholder="Enter account number"
                   class="w-full px-3.5 py-2.5 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-emerald-500 outline-none transition font-mono">
          </div>

          <div>
            <label class="block font-bold text-gray-700 mb-1">Upload QR Code Image</label>
            <input type="file" @change="uploadQRCode($event)" accept="image/*" id="qrFileInput"
                   class="w-full text-xs text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-emerald-50 file:text-emerald-700 hover:file:bg-emerald-100">
          </div>

          <!-- QR Preview -->
          <template x-if="form.qr">
            <div class="mt-2 text-center bg-gray-50 p-3 rounded-xl border border-gray-100">
              <p class="text-[10px] text-gray-400 mb-1 font-semibold">QR Code Preview:</p>
              <img :src="form.qr" class="w-32 h-32 object-contain mx-auto rounded-lg border border-gray-200 bg-white p-1">
            </div>
          </template>
        </div>

        <button type="submit" :disabled="loading"
                class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl shadow-sm transition mt-3 disabled:opacity-50">
          <span x-text="loading ? 'Saving Changes...' : 'Save Bank Details'"></span>
        </button>
      </form>
    </div>

  </main>

  <!-- EDIT MODAL -->
  <div x-show="showModal" class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 backdrop-blur-sm" x-cloak>
    <div class="bg-white rounded-3xl w-full max-w-sm p-6 space-y-4 shadow-2xl" @click.away="showModal = false">
      <div class="flex justify-between items-center border-b border-gray-100 pb-3">
        <h3 class="font-bold text-gray-800 text-sm uppercase">Edit Channel Details</h3>
        <button @click="showModal = false" class="text-gray-400 hover:text-gray-600 font-bold text-base">✕</button>
      </div>

      <form @submit.prevent="saveModalSettings()" class="space-y-3 text-xs">
        <div>
          <label class="block font-bold text-gray-700 mb-1">Account Holder Name</label>
          <input type="text" x-model="modalForm.name" required
                 class="w-full px-3.5 py-2.5 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-emerald-500 outline-none transition">
        </div>

        <div>
          <label class="block font-bold text-gray-700 mb-1">Account / Mobile Number</label>
          <input type="text" x-model="modalForm.number" required
                 class="w-full px-3.5 py-2.5 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-emerald-500 outline-none transition font-mono">
        </div>

        <div>
          <label class="block font-bold text-gray-700 mb-1">Update QR Code Image</label>
          <input type="file" @change="uploadModalQRCode($event)" accept="image/*"
                 class="w-full text-xs text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-emerald-50 file:text-emerald-700 hover:file:bg-emerald-100">
        </div>

        <template x-if="modalForm.qr">
          <div class="text-center bg-gray-50 p-2 rounded-xl border border-gray-100">
            <img :src="modalForm.qr" class="w-24 h-24 object-contain mx-auto rounded-lg bg-white p-1">
          </div>
        </template>

        <div class="flex gap-2 pt-2">
          <button type="button" @click="showModal = false" class="w-1/2 bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold py-2.5 rounded-xl transition">Cancel</button>
          <button type="submit" :disabled="loading" class="w-1/2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-xl transition disabled:opacity-50">Save</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ADMIN BOTTOM NAVIGATION BAR -->
  <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-100 flex justify-around py-3 z-20 max-w-md mx-auto shadow-lg">
    <a href="dashboard.html" class="flex flex-col items-center text-[10px] font-medium text-gray-400 hover:text-emerald-600 transition">
      <span class="text-base">🏠</span>
      <span class="mt-0.5">Dashboard</span>
    </a>
    <a href="dashboard.html" class="flex flex-col items-center text-[10px] font-medium text-gray-400 hover:text-emerald-600 transition">
      <span class="text-base">📊</span>
      <span class="mt-0.5">Overview</span>
    </a>
    <a href="dashboard.html" class="flex flex-col items-center text-[10px] font-medium text-gray-400 hover:text-emerald-600 transition">
      <span class="text-base">💳</span>
      <span class="mt-0.5">Requests</span>
    </a>
    <a href="dashboard.html" class="flex flex-col items-center text-[10px] font-medium text-gray-400 hover:text-emerald-600 transition">
      <span class="text-base">👥</span>
      <span class="mt-0.5">Users</span>
    </a>
    <a href="bank.html" class="flex flex-col items-center text-[10px] font-bold text-emerald-600 transition">
      <span class="text-base">🏦</span>
      <span class="mt-0.5">Bank</span>
    </a>
  </nav>

  <script>
    function adminBankData() {
      return {
        formCategory: 'ewallet',
        activeTab: 'gcash',
        currentProviders: [],
        ewallets: [
          { id: 'maya', name: 'Maya' }, { id: 'gcash', name: 'GCash' }, { id: 'coins_ph', name: 'Coins PH' },
          { id: 'grabpay', name: 'GrabPay' }, { id: 'paypal', name: 'PayPal' }, { id: 'bpi_direct_banko', name: 'BPI Direct BanKo' },
          { id: 'tala_wallet', name: 'Tala Wallet' }, { id: 'dragonpay_credits', name: 'DragonPay Credits' }, { id: 'lazada_wallet', name: 'Lazada Wallet' },
          { id: 'cliqq_pay', name: '7-11 CLIQQ Pay' }, { id: 'ml_wallet', name: 'ML Wallet' }, { id: 'trust_wallet', name: 'Trust Wallet' }
        ],
        banks: [
          { id: 'bdo', name: 'BDO Unibank, Inc.' }, { id: 'landbank', name: 'Land Bank of the Philippines' }, { id: 'bpi', name: 'Bank of the Philippine Islands (BPI)' },
          { id: 'metrobank', name: 'Metrobank' }, { id: 'chinabank', name: 'China Banking Corporation' }, { id: 'rcbc', name: 'RCBC' },
          { id: 'security_bank', name: 'Security Bank' }, { id: 'pnb', name: 'Philippine National Bank' }, { id: 'dbp', name: 'DBP' },
          { id: 'unionbank', name: 'UnionBank' }, { id: 'hsbc', name: 'HSBC' }, { id: 'bank_of_america', name: 'Bank of America' },
          { id: 'citibank', name: 'CitiBank' }, { id: 'mufg_bank', name: 'MUFG Bank' }, { id: 'standard_chartered', name: 'Standard Chartered' },
          { id: 'psbank', name: 'PSBank' }, { id: 'china_bank_savings', name: 'China Bank Savings' }, { id: 'city_savings_bank', name: 'City Savings Bank' },
          { id: 'bank_of_makati', name: 'Bank of Makati' }, { id: 'allbank', name: 'AllBank' }, { id: 'bangko_kabayan', name: 'Bangko Kabayan' },
          { id: 'bdo_network_bank', name: 'BDO Network Bank' }, { id: 'eastwest_rural_bank', name: 'EastWest Rural Bank' }, { id: 'card_bank', name: 'CARD Bank' },
          { id: 'cebuana_rural_bank', name: 'Cebuana Lhuillier Rural Bank' }, { id: 'maya_bank', name: 'Maya Bank' }, { id: 'gotyme', name: 'GoTyme Bank' },
          { id: 'uniondigital', name: 'UnionDigital Bank' }, { id: 'unobank', name: 'Unobank' }, { id: 'tonik', name: 'Tonik Digital Bank' }, { id: 'ofbank', name: 'OFBank' }
        ],
        loading: false,
        errorMessage: '',
        successMessage: '',
        showModal: false,
        modalProvider: '',
        settings: {},
        form: { name: '', number: '', qr: '' },
        modalForm: { name: '', number: '', qr: '' },

        initBank() {
          if (!DB.isAdminLoggedIn()) { 
            window.location.href = '../login.html'; 
            return; 
          }
          this.updateProviderList();
          this.loadSettings();
        },

        updateProviderList() {
          if (this.formCategory === 'ewallet') {
            this.currentProviders = this.ewallets;
          } else {
            this.currentProviders = this.banks;
          }
          this.activeTab = this.currentProviders[0].id;
        },

        async loadSettings() {
          try {
            const { data, error } = await supabaseClient.from('settings').select('*');
            if (!error && data) {
              let tempSettings = {};
              data.forEach(item => {
                tempSettings[item.key] = item.value;
              });
              this.settings = tempSettings;
            }
          } catch (err) {
            console.error("Error loading settings:", err);
          }
        },

        openEditModal(provider) {
          this.modalProvider = provider;
          this.modalForm.name = this.settings[provider + '_name'] || '';
          this.modalForm.number = this.settings[provider + '_number'] || '';
          this.modalForm.qr = this.settings[provider + '_qr'] || '';
          this.showModal = true;
        },

        async deleteAccount(provider) {
          if (!confirm(`Are you sure you want to delete account details for this provider?`)) return;

          try {
            for (const key of [provider + '_name', provider + '_number', provider + '_qr']) {
              await supabaseClient.from('settings').upsert({ key: key, value: '' }, { onConflict: 'key' });
            }

            delete this.settings[provider + '_name'];
            delete this.settings[provider + '_number'];
            delete this.settings[provider + '_qr'];
            this.settings = { ...this.settings };

            this.successMessage = `Account details deleted successfully!`;
            setTimeout(() => { this.successMessage = ''; }, 3000);
          } catch (err) {
            this.errorMessage = 'Error deleting info: ' + err.message;
          }
        },

        async uploadQRCode(event) {
          const file = event.target.files[0];
          if (!file) return;

          this.loading = true;
          try {
            const fileExt = file.name.split('.').pop();
            const fileName = `${this.activeTab}_qr_${Date.now()}.${fileExt}`;
            const { error: uploadError } = await supabaseClient.storage.from('qrcodes').upload(fileName, file, { upsert: true });
            if (uploadError) throw uploadError;

            const { data: publicURLData } = supabaseClient.storage.from('qrcodes').getPublicUrl(fileName);
            this.form.qr = publicURLData.publicUrl;
            this.successMessage = 'QR Code uploaded successfully!';
          } catch (err) {
            this.errorMessage = 'Failed to upload QR image: ' + err.message;
          } finally {
            this.loading = false;
            setTimeout(() => { this.successMessage = ''; }, 3000);
          }
        },

        async uploadModalQRCode(event) {
          const file = event.target.files[0];
          if (!file) return;

          this.loading = true;
          try {
            const fileExt = file.name.split('.').pop();
            const fileName = `${this.modalProvider}_qr_${Date.now()}.${fileExt}`;
            const { error: uploadError } = await supabaseClient.storage.from('qrcodes').upload(fileName, file, { upsert: true });
            if (uploadError) throw uploadError;

            const { data: publicURLData } = supabaseClient.storage.from('qrcodes').getPublicUrl(fileName);
            this.modalForm.qr = publicURLData.publicUrl;
          } catch (err) {
            this.errorMessage = 'Failed to upload QR image: ' + err.message;
          } finally {
            this.loading = false;
          }
        },

        async saveSettings() {
          this.errorMessage = '';
          this.successMessage = '';
          this.loading = true;

          try {
            const p = this.activeTab;
            const updates = [
              { key: p + '_name', value: this.form.name },
              { key: p + '_number', value: this.form.number },
              { key: p + '_qr', value: this.form.qr }
            ];

            for (const item of updates) {
              this.settings[item.key] = item.value;
              await supabaseClient.from('settings').upsert(item, { onConflict: 'key' });
            }
            this.settings = { ...this.settings };
            
            this.form.name = '';
            this.form.number = '';
            this.form.qr = '';
            const fileInput = document.getElementById('qrFileInput');
            if (fileInput) fileInput.value = '';

            this.successMessage = 'Payment channel details saved successfully!';
          } catch (err) {
            this.errorMessage = 'Error saving settings: ' + err.message;
          } finally {
            this.loading = false;
            setTimeout(() => { this.successMessage = ''; }, 3000);
          }
        },

        async saveModalSettings() {
          this.loading = true;
          try {
            const p = this.modalProvider;
            const updates = [
              { key: p + '_name', value: this.modalForm.name },
              { key: p + '_number', value: this.modalForm.number },
              { key: p + '_qr', value: this.modalForm.qr }
            ];

            for (const item of updates) {
              this.settings[item.key] = item.value;
              await supabaseClient.from('settings').upsert(item, { onConflict: 'key' });
            }
            this.settings = { ...this.settings };

            this.showModal = false;
            this.successMessage = `Account details updated successfully!`;
          } catch (err) {
            this.errorMessage = 'Error updating settings: ' + err.message;
          } finally {
            this.loading = false;
            setTimeout(() => { this.successMessage = ''; }, 3000);
          }
        }
      }
    }
  </script>
</body>
</html>
